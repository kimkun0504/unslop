name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CHECK_DIFF_ALLOW_TEST_CHANGES: ${{ contains(github.event.pull_request.labels.*.name, 'tests-reviewed') && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f
        with:
          tool: cargo-deny@0.21.0,cargo-llvm-cov@0.9.1,cargo-mutants@27.1.0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.9"
      - run: scripts/setup
      - run: scripts/verify
      - run: scripts/mutation
