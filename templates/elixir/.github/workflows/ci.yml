name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CHECK_DIFF_ALLOW_TEST_CHANGES: ${{ contains(github.event.pull_request.labels.*.name, 'tests-reviewed') && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: "0.13.9"
      - run: scripts/setup
      - run: scripts/verify
      - run: scripts/mutation
