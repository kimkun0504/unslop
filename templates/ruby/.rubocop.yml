plugins:
  - rubocop-performance
  - rubocop-rspec

require:
  - ./tools/guard/cops.rb

AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  EnabledByDefault: true
  DisplayCopNames: true
  CacheRootDirectory: .rubocop-cache
  Exclude:
    - vendor/**/*

Style/Documentation:
  Enabled: false
Style/DocumentationMethod:
  Enabled: false
Style/Copyright:
  Enabled: false
Style/FrozenStringLiteralComment:
  Enabled: false
Bundler/GemComment:
  Enabled: false
Bundler/GemVersion:
  EnforcedStyle: required
Style/SingleLineBlockParams:
  Enabled: false
Style/ConstantVisibility:
  Exclude:
    - tools/**/*
Style/MissingElse:
  Enabled: false
Lint/ConstantResolution:
  Enabled: false
Style/MethodCallWithArgsParentheses:
  AllowedMethods:
    - to
    - not_to
    - to_not
    - eq
    - raise_error
    - gem
    - ruby
    - source
    - group
    - require
    - require_relative
    - attr_reader
    - private_constant
    - private_class_method
    - include
    - describe
    - context
    - it
    - exit
    - target
    - signature
    - check
    - configure_code_diagnostics
  AllowedPatterns:
    - \Aassert
Metrics/MethodLength:
  Max: 10
Metrics/AbcSize:
  Max: 15
Layout/LineLength:
  Max: 120
RSpec/AlignRightLetBrace:
  Enabled: false
RSpec/ExampleLength:
  Max: 8
RSpec/MultipleExpectations:
  Max: 2

Guard/OutputThroughPort:
  Enabled: true
  Include:
    - lib/**/*.rb
Guard/DomainPurity:
  Enabled: true
  Include:
    - lib/app/domain/**/*.rb
