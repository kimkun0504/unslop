name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: swift:6.4.2-noble
    env:
      CHECK_DIFF_ALLOW_TEST_CHANGES: ${{ contains(github.event.pull_request.labels.*.name, 'tests-reviewed') && '1' || '' }}
    steps:
      - run: apt-get update -qq && apt-get install -y -qq git curl jq > /dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: "0.13.9"
      - run: scripts/setup
      - run: scripts/verify
