included:
  - Sources
  - Tests
  - Package.swift
excluded:
  - .build
strict: true
opt_in_rules:
  - all
disabled_rules:
  - closure_end_indentation
  - conditional_returns_on_newline
  - contrasted_opening_brace
  - explicit_acl
  - explicit_enum_raw_value
  - explicit_self
  - explicit_top_level_acl
  - explicit_type_interface
  - file_header
  - indentation_width
  - line_length
  - missing_docs
  - multiline_arguments_brackets
  - multiline_literal_brackets
  - multiline_parameters_brackets
  - no_extension_access_modifier
  - no_grouping_extension
  - one_declaration_per_file
  - opening_brace
  - prefer_nimble
  - prefixed_toplevel_constant
  - required_deinit
  - sorted_enum_cases
  - trailing_comma
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_between_cases
custom_rules:
  domain_no_io:
    included: "Sources/Domain/.*\\.swift"
    regex: "(import +(Foundation|FoundationEssentials|Dispatch|Glibc|Darwin|Musl|WinSDK)|FileManager|FileHandle|ProcessInfo|Date\\(|\\.random)"
    message: "the domain does no I/O: move it behind a port in CLI"
    severity: error
  output_through_port:
    included: "Sources/(Domain|CLI)/.*\\.swift"
    regex: "(^|[^.A-Za-z])(print|debugPrint|dump)\\("
    message: "write through an Output port; the process streams belong to Sources/app"
    severity: error
