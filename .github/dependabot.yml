version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/templates/*"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/src/unslop/data/tools/node"
    schedule:
      interval: weekly
    groups:
      node-tools:
        patterns: ["*"]
