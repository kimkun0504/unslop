name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: "0.13.9"
      - name: the tag matches the package and plugin versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/unslop/__init__.py)
          [ "$TAG" = "v$version" ] || { echo "::error::tag $TAG does not match package version $version"; exit 1; }
          [ "$(jq -r .version plugin/.claude-plugin/plugin.json)" = "$version" ] || { echo "::error::plugin.json version differs"; exit 1; }
      - run: uv build
      - name: create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
      - name: publish to PyPI
        if: vars.PUBLISH_TO_PYPI == 'true'
        run: uv publish --trusted-publishing always
