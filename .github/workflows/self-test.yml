name: self-test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  hooks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: shellcheck global/hooks/*.sh tests/hooks/run.sh install/install.sh common/scripts/* bin/unslop
      - run: jq empty global/managed-settings.json common/.claude/settings.json common/.github/rulesets/main.json
      - run: tests/hooks/run.sh
  python-template:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.9"
      - run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          bin/unslop new python "$RUNNER_TEMP/py"
          cd "$RUNNER_TEMP/py"
          scripts/setup
          scripts/verify
          scripts/mutation
  ts-react-template:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 12.21.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          bin/unslop new ts-react "$RUNNER_TEMP/ts"
          cd "$RUNNER_TEMP/ts"
          scripts/setup
          scripts/verify
          scripts/mutation
  go-template:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: templates/go/go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.15.0
          install-only: true
      - run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          bin/unslop new go "$RUNNER_TEMP/go"
          cd "$RUNNER_TEMP/go"
          scripts/setup
          scripts/verify
  kotlin-spring-template:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          gradle-version: "9.9.1"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.9"
      - run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          curl -sSI https://repo.maven.apache.org/maven2/org/apache/commons/commons-compress/1.27.1/commons-compress-1.27.1.pom | head -3
          curl -sSI https://repo.maven.apache.org/maven2/org/springframework/spring-core/7.0.10/spring-core-7.0.10.pom | head -3
          curl -sSI https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-gradle-plugins-bom/2.4.21/kotlin-gradle-plugins-bom-2.4.21.pom | head -3
          env | grep -iE 'gradle|maven|proxy' | sort
          bin/unslop new kotlin-spring "$RUNNER_TEMP/kt"
          cd "$RUNNER_TEMP/kt"
          gradle --info help 2>&1 | grep -iE "maven.apache|plugins.gradle|status|missing|resource|cache|offline|refresh" | head -40 || true
          scripts/setup
          scripts/verify
          scripts/mutation
