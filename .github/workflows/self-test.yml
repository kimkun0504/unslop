name: self-test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  hooks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: shellcheck global/hooks/*.sh tests/hooks/run.sh tests/contract/check.sh install/install.sh common/scripts/* bin/unslop templates/*/scripts/*
      - run: jq empty global/managed-settings.json common/.claude/settings.json common/.github/rulesets/main.json
      - run: tests/hooks/run.sh
      - run: tests/contract/check.sh
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.9"
      - run: uv run --no-project --with tree-sitter-language-pack==1.25.0 --with pytest==9.2.0 pytest -q tests/guard
  python-template:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.9"
      - run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          bin/unslop new python "$RUNNER_TEMP/py"
          cd "$RUNNER_TEMP/py"
          scripts/setup
          scripts/verify
          scripts/mutation
  ts-react-template:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 12.21.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.9"
      - run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          bin/unslop new ts-react "$RUNNER_TEMP/ts"
          cd "$RUNNER_TEMP/ts"
          scripts/setup
          scripts/verify
          scripts/mutation
  go-template:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: templates/go/go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.15.0
          install-only: true
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.9"
      - run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          bin/unslop new go "$RUNNER_TEMP/go"
          cd "$RUNNER_TEMP/go"
          scripts/setup
          scripts/verify
  kotlin-spring-template:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          gradle-version: "9.9.1"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.9"
      - run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          bin/unslop new kotlin-spring "$RUNNER_TEMP/kt"
          cd "$RUNNER_TEMP/kt"
          scripts/setup
          git remote remove origin 2>/dev/null || true
          expect_fail() {
            printf '\n%s\n' "$2" >> "$3"
            if scripts/fast-check > "$RUNNER_TEMP/neg.txt" 2>&1; then echo "MISSED: $1"; grep -iE "detekt|task|warning|error|kotlin" "$RUNNER_TEMP/neg.txt" | head -60; exit 1; fi
            grep -q -- "$4" "$RUNNER_TEMP/neg.txt" || { echo "WRONG CHECK for $1"; tail -20 "$RUNNER_TEMP/neg.txt"; exit 1; }
            echo "caught: $1 by $4"
            git checkout -- .
          }
          M=src/main/kotlin/com/example/app/quote/Pricing.kt
          expect_fail "line comment" "// explains the hack" "$M" "comments are forbidden"
          expect_fail "kdoc" "/** docs */" "$M" "comments are forbidden"
          expect_fail "println" 'fun debug() = println("x")' "$M" "println() is forbidden"
          expect_fail "suppress annotation" '@Suppress("MagicNumber") fun n() = 42' "$M" "check-diff"
          expect_fail "unsafe call" 'fun unsafe(s: String?) = s!!.length' "$M" "operator is forbidden"
          expect_fail "long method" "$(printf 'fun long(): Int {\n    var total = 0\n'; for i in $(seq 1 45); do printf '    total += 1\n'; done; printf '    return total\n}')" "$M" "LongMethod"
          sed -i 's/SILVER(5)/SILVER(6)/' "$M"
          if scripts/fast-check > "$RUNNER_TEMP/neg.txt" 2>&1; then echo "MISSED: behaviour change"; exit 1; fi
          grep -q "FAILED" "$RUNNER_TEMP/neg.txt" && echo "caught: behaviour change by a failing test"
          git checkout -- .
          scripts/verify
          scripts/mutation
  terraform-template:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337
        with:
          tflint_version: v0.66.0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.9"
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          bin/unslop new terraform "$RUNNER_TEMP/tf"
          cd "$RUNNER_TEMP/tf"
          scripts/setup
          scripts/verify
          git add .terraform.lock.hcl && git commit -qm lock
          expect_fail() {
            printf '\n%s\n' "$2" >> "$3"
            if scripts/$5 > "$RUNNER_TEMP/neg.txt" 2>&1; then echo "MISSED: $1"; tail -30 "$RUNNER_TEMP/neg.txt"; exit 1; fi
            grep -q -- "$4" "$RUNNER_TEMP/neg.txt" || { echo "WRONG CHECK for $1"; tail -30 "$RUNNER_TEMP/neg.txt"; exit 1; }
            echo "caught: $1 by $4"
            git checkout -- .
          }
          expect_fail "comment" "# note" main.tf "comments are forbidden" fast-check
          expect_fail "untyped variable" 'variable "loose" {}' variables.tf "terraform_typed_variables" fast-check
          expect_fail "open ingress" 'resource "aws_security_group" "open" {
            name        = "open"
            description = "open"
            ingress {
              description = "ssh"
              from_port   = 22
              to_port     = 22
              protocol    = "tcp"
              cidr_blocks = ["0.0.0.0/0"]
            }
          }' main.tf "CKV_AWS_24" verify
          sed -i 's/block_public_acls       = true/block_public_acls       = false/' modules/storage_bucket/main.tf
          if scripts/fast-check > "$RUNNER_TEMP/neg.txt" 2>&1; then echo "MISSED: public bucket"; exit 1; fi
          grep -q "all public access must be blocked" "$RUNNER_TEMP/neg.txt" && echo "caught: public bucket by terraform test"
          git checkout -- .
  java-spring-template:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          gradle-version: "9.9.1"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.9"
      - run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          bin/unslop new java-spring "$RUNNER_TEMP/java"
          cd "$RUNNER_TEMP/java"
          scripts/setup
          expect_fail() {
            printf '%s\n' "$2" > "$3"
            if scripts/fast-check > "$RUNNER_TEMP/neg.txt" 2>&1; then echo "MISSED: $1"; tail -40 "$RUNNER_TEMP/neg.txt"; exit 1; fi
            grep -q -- "$4" "$RUNNER_TEMP/neg.txt" || { echo "WRONG CHECK for $1"; tail -40 "$RUNNER_TEMP/neg.txt"; exit 1; }
            echo "caught: $1 by $4"
            rm -f "$3"
            git checkout -- .
          }
          Q=src/main/java/com/example/app/quote
          expect_fail "comment" 'package com.example.app.quote; final class Note {} // note' "$Q/Note.java" "comments are forbidden"
          expect_fail "System.out" 'package com.example.app.quote; final class Shout { static void say() { System.out.println("x"); } }' "$Q/Shout.java" "SystemOut"
          expect_fail "null return" 'package com.example.app.quote; final class Maybe { static String maybe() { return null; } }' "$Q/Maybe.java" "NullAway"
          expect_fail "suppression" 'package com.example.app.quote; @SuppressWarnings("unused") final class Quiet {}' "$Q/Quiet.java" "check-diff"
          sed -i 's/SILVER(5)/SILVER(6)/' "$Q/Tier.java"
          if scripts/fast-check > "$RUNNER_TEMP/neg.txt" 2>&1; then echo "MISSED: behaviour change"; exit 1; fi
          grep -q "FAILED" "$RUNNER_TEMP/neg.txt" && echo "caught: behaviour change by a failing test"
          git checkout -- .
          scripts/verify
          scripts/mutation
  rust-template:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f
        with:
          tool: cargo-deny@0.21.0,cargo-llvm-cov@0.9.1,cargo-mutants@27.1.0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.9"
      - run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          bin/unslop new rust "$RUNNER_TEMP/rs"
          cd "$RUNNER_TEMP/rs"
          scripts/setup
          expect_fail() {
            printf '%s\n' "$2" >> "$3"
            if scripts/fast-check > "$RUNNER_TEMP/neg.txt" 2>&1; then echo "MISSED: $1"; tail -40 "$RUNNER_TEMP/neg.txt"; exit 1; fi
            grep -q -- "$4" "$RUNNER_TEMP/neg.txt" || { echo "WRONG CHECK for $1"; tail -40 "$RUNNER_TEMP/neg.txt"; exit 1; }
            echo "caught: $1 by $4"
            git checkout -- .
          }
          expect_fail "comment" '// note' crates/app/src/lib.rs "comments are forbidden"
          expect_fail "allow attribute" $'\n#[allow(clippy::unwrap_used)]\npub const fn quiet() {}' crates/domain/src/lib.rs "check-diff"
          expect_fail "println" $'\n#[must_use]\npub fn noisy() -> u8 {\n    println!("x");\n    1\n}' crates/app/src/lib.rs "use of \`println!\`"
          expect_fail "domain I/O" $'\n#[must_use]\npub fn leak() -> String {\n    std::fs::read_to_string("x").unwrap_or_default()\n}' crates/domain/src/lib.rs "disallowed method"
          sed -i 's/Self::Silver => 5,/Self::Silver => 6,/' crates/domain/src/pricing.rs
          if scripts/fast-check > "$RUNNER_TEMP/neg.txt" 2>&1; then echo "MISSED: behaviour change"; exit 1; fi
          grep -q "FAILED" "$RUNNER_TEMP/neg.txt" && echo "caught: behaviour change by a failing test"
          git checkout -- .
          scripts/verify
          scripts/mutation
  dotnet-template:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: templates/dotnet/global.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.9"
      - run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          bin/unslop new dotnet "$RUNNER_TEMP/net"
          cd "$RUNNER_TEMP/net"
          scripts/setup
          git add -A && git commit -qm lock
          expect_fail() {
            printf '%s\n' "$2" > "$3"
            if scripts/fast-check > "$RUNNER_TEMP/neg.txt" 2>&1; then echo "MISSED: $1"; tail -40 "$RUNNER_TEMP/neg.txt"; exit 1; fi
            grep -q -- "$4" "$RUNNER_TEMP/neg.txt" || { echo "WRONG CHECK for $1"; tail -40 "$RUNNER_TEMP/neg.txt"; exit 1; }
            echo "caught: $1 by $4"
            rm -f "$3"
            git checkout -- .
          }
          D=src/App.Domain
          expect_fail "comment" $'namespace App.Domain;\n\npublic static class Note\n{\n    public static int Value => 1; // note\n}' "$D/Note.cs" "comments are forbidden"
          expect_fail "console in domain" $'namespace App.Domain;\n\npublic static class Shout\n{\n    public static void Say() => Console.WriteLine("x");\n}' "$D/Shout.cs" "DomainReferencesOnlyPureFrameworkAssemblies"
          expect_fail "pragma suppression" $'namespace App.Domain;\n\n#pragma warning disable CA1822\npublic static class Quiet\n{\n}' "$D/Quiet.cs" "check-diff"
          expect_fail "unchecked null" $'namespace App.Domain;\n\npublic static class Maybe\n{\n    public static string Value() => null;\n}' "$D/Maybe.cs" "CS8603"
          sed -i 's/Tier.Silver => 5,/Tier.Silver => 6,/' "$D/Pricing.cs"
          if scripts/fast-check > "$RUNNER_TEMP/neg.txt" 2>&1; then echo "MISSED: behaviour change"; exit 1; fi
          grep -qE "Failed|failed" "$RUNNER_TEMP/neg.txt" && echo "caught: behaviour change by a failing test"
          git checkout -- .
          scripts/verify
          scripts/mutation
