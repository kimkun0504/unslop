name: scratch
on:
  push:
    branches: ["scratch/**"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0
        with:
          ruby-version: "4.0.10"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.9"
      - name: run tests/scratch.sh
        continue-on-error: true
        run: bash tests/scratch.sh
        env:
          SCRATCH_TEMPLATE: ruby
          SCRATCH_FIX: bundle exec rubocop -A --format quiet
