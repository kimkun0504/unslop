name: scratch
on:
  push:
    branches: ["scratch/**"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: "8.5"
          coverage: pcov
          tools: composer:v2
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.9"
      - name: run tests/scratch.sh
        continue-on-error: true
        run: bash tests/scratch.sh
        env:
          SCRATCH_TEMPLATE: php
          SCRATCH_FIX: vendor/bin/php-cs-fixer fix --show-progress=none
