name: scratch
on:
  push:
    branches: ["scratch/**"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    if: ${{ !startsWith(github.ref_name, 'scratch/adopt') }}
    container: ${{ github.ref_name == 'scratch/swift' && 'swift:6.4.2-noble' || '' }}
    env:
      TEMPLATE: ${{ github.ref_name }}
    steps:
      - if: github.ref_name == 'scratch/swift'
        run: apt-get update -qq && apt-get install -y -qq git curl jq > /dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - if: github.ref_name == 'scratch/swift'
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.9"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        if: github.ref_name == 'scratch/elixir'
        with:
          version-file: templates/elixir/.tool-versions
          version-type: strict
      - name: run tests/scratch.sh
        continue-on-error: true
        run: bash tests/scratch.sh "${TEMPLATE#scratch/}"
  adopt:
    runs-on: ubuntu-24.04
    if: ${{ startsWith(github.ref_name, 'scratch/adopt') }}
    strategy:
      fail-fast: false
      matrix:
        fixture: [python, python-pip, typescript, go, jvm-maven, jvm-gradle, terraform, rust, dotnet, php, ruby, elixir, swift]
    container: ${{ matrix.fixture == 'swift' && 'swift:6.4.2-noble' || '' }}
    steps:
      - if: matrix.fixture == 'swift'
        run: apt-get update -qq && apt-get install -y -qq git curl jq > /dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.9"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: matrix.fixture == 'typescript'
        with:
          node-version: lts/*
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        if: matrix.fixture == 'go'
        with:
          go-version: "1.26"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        if: startsWith(matrix.fixture, 'jvm')
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        if: matrix.fixture == 'jvm-gradle'
        with:
          gradle-version: "9.9.1"
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f
        if: matrix.fixture == 'rust'
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        if: matrix.fixture == 'dotnet'
        with:
          dotnet-version: "10.0.x"
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        if: matrix.fixture == 'php'
        with:
          php-version: "8.4"
          coverage: pcov
          tools: composer:v2
      - uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0
        if: matrix.fixture == 'ruby'
        with:
          ruby-version: "4.0.10"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        if: matrix.fixture == 'elixir'
        with:
          otp-version: "29.1.2"
          elixir-version: "1.20.5"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        if: matrix.fixture == 'terraform'
        with:
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337
        if: matrix.fixture == 'terraform'
      - if: matrix.fixture == 'swift'
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: run tests/adopt/run.sh
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash tests/adopt/run.sh "${{ matrix.fixture }}" 2>&1 | tee "$RUNNER_TEMP/adopt.log"
          echo "RESULT adopt: ${PIPESTATUS[0]}"
