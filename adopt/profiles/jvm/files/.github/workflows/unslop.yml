name: unslop
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: unslop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unslop:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CHECK_DIFF_ALLOW_TEST_CHANGES: ${{ contains(github.event.pull_request.labels.*.name, 'tests-reviewed') && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.9"
      - run: scripts/setup
      - run: scripts/verify
