name: unslop
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: unslop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unslop:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CHECK_DIFF_ALLOW_TEST_CHANGES: ${{ contains(github.event.pull_request.labels.*.name, 'tests-reviewed') && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.9"
      - run: scripts/setup
      - run: scripts/verify
