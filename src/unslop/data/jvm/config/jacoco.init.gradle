allprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin('java')) {
            project.apply plugin: 'jacoco'
            project.jacoco.toolVersion = '0.8.14'
            project.tasks.named('jacocoTestReport') { reports { xml.required = true } }
            project.tasks.withType(Test).configureEach { finalizedBy project.tasks.named('jacocoTestReport') }
        }
    }
}
