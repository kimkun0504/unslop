rootProject {
    afterEvaluate { project ->
        if (!project.plugins.hasPlugin("java")) {
            return
        }
        def runtime = project.configurations.getByName("testRuntimeClasspath")
        def tools = project.configurations.create("unslopPit") {
            canBeConsumed = false
            canBeResolved = true
            extendsFrom(project.configurations.getByName("testImplementation"), project.configurations.getByName("testRuntimeOnly"))
            attributes { attrs ->
                runtime.attributes.keySet().each { key -> attrs.attribute(key, runtime.attributes.getAttribute(key)) }
            }
        }
        def pit = project.findProperty("unslopPitVersion")
        def plugin = project.findProperty("unslopPitJunit5Version")
        project.dependencies.add("unslopPit", "org.pitest:pitest-command-line:${pit}")
        project.dependencies.add("unslopPit", "org.pitest:pitest-junit5-plugin:${plugin}")
        project.dependencies.add("unslopPit", "org.junit.platform:junit-platform-launcher")
        project.tasks.register("unslopPitClasspath") {
            dependsOn "testClasses"
            def target = project.file(".unslop/out/pit/classpath.txt")
            doLast {
                def sets = project.sourceSets
                def entries = sets.test.output.files + sets.main.output.files + tools.files
                target.parentFile.mkdirs()
                target.text = entries.collect { it.absolutePath }.join(File.pathSeparator)
            }
        }
    }
}
